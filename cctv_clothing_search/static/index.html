<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sightline — Clothing Search</title>
  <style>
    :root {
      --bg: #0B0D11;
      --panel: #12151C;
      --surface: #181C25;
      --surface-hover: #202633;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text: #F1F5F9;
      --muted: #8B95A7;
      --accent: #38BDF8;
      --accent-soft: rgba(56, 189, 248, 0.14);
      --success: #22C55E;
      --warning: #F59E0B;
      --mono: 'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace;
      --sans: 'Geist', 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    button, input, select { font-family: inherit; font-size: inherit; color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    /* Top Bar */
    .topbar {
      height: 52px;
      padding: 0 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      font-size: 13px;
    }
    .brand-mark {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      border: 1.5px solid var(--accent);
      display: grid;
      place-items: center;
    }
    .brand-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--accent);
    }

    .topbar-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .seg-group {
      display: inline-flex;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
    }
    .seg-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 4px 10px;
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 12px;
      cursor: pointer;
      transition: background 140ms ease, color 140ms ease;
    }
    .seg-btn:hover { color: var(--text); }
    .seg-btn.active {
      background: var(--surface);
      color: var(--accent);
      font-weight: 600;
    }

    .status-pill {
      font-family: var(--mono);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 5px;
    }

    .btn-primary {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      color: var(--text);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 140ms ease, border-color 140ms ease, transform 100ms ease;
    }
    .btn-primary:hover { background: var(--surface-hover); border-color: var(--accent); }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.45; cursor: wait; }

    /* Search Strip */
    .search-strip {
      padding: 12px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }
    .search-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .search-box {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-icon {
      position: absolute;
      left: 12px;
      color: var(--muted);
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      height: 38px;
      background: var(--bg);
      border: 1px solid var(--border-strong);
      border-radius: 7px;
      padding: 0 58px 0 36px;
      font-size: 14px;
      color: var(--text);
      transition: border-color 150ms ease;
    }
    .search-input:focus { border-color: var(--accent); outline: none; }
    .search-input::placeholder { color: #616B7D; }
    .kbd-hint {
      position: absolute;
      right: 10px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 1px 6px;
      border-radius: 4px;
      pointer-events: none;
    }
    .filter-select {
      height: 38px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 0 10px;
      min-width: 138px;
      cursor: pointer;
    }
    .btn-ghost {
      height: 38px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 0 12px;
      color: var(--muted);
      cursor: pointer;
      transition: background 140ms ease, color 140ms ease;
    }
    .btn-ghost:hover { background: var(--surface); color: var(--text); }

    /* Main Split Grid */
    .workspace {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(340px, 0.85fr);
    }

    /* Left Video + Scrubber Column */
    .stage {
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
      border-right: 1px solid var(--border);
    }
    .player-wrap {
      flex: 1;
      min-height: 0;
      background: #050608;
      border: 1px solid var(--border);
      border-radius: 8px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .video-stage-inner {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      max-width: 100%;
      max-height: 100%;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    canvas#overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Match Timeline Bar */
    .timeline-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    .timeline-track {
      position: relative;
      height: 24px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 5px;
      cursor: pointer;
      overflow: hidden;
    }
    .timeline-progress {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      background: rgba(56, 189, 248, 0.10);
      pointer-events: none;
    }
    .timeline-playhead {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--text);
      pointer-events: none;
      z-index: 3;
    }
    .tick {
      position: absolute;
      top: 3px;
      bottom: 3px;
      width: 4px;
      margin-left: -2px;
      border-radius: 2px;
      opacity: 0.78;
      cursor: pointer;
      z-index: 2;
      transition: transform 120ms ease, opacity 120ms ease;
    }
    .tick:hover, .tick.selected {
      opacity: 1;
      transform: scaleY(1.22);
      box-shadow: 0 0 0 1px #FFF;
    }

    .transport {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .transport-left, .transport-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .t-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .t-btn:hover { border-color: var(--accent); color: var(--accent); }
    .time-readout {
      font-family: var(--mono);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }
    .active-tag {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* Right Results Column */
    .results-pane {
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--panel);
    }
    .results-head {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }
    .results-title {
      font-weight: 600;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }
    .query-speed {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      margin-left: 8px;
    }
    .results-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .match-card {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 8px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 7px;
      cursor: pointer;
      text-align: left;
      transition: background 130ms ease, border-color 130ms ease;
    }
    .match-card:hover { background: var(--surface-hover); border-color: var(--border-strong); }
    .match-card.selected { background: var(--accent-soft); border-color: var(--accent); }

    .thumb {
      width: 52px;
      height: 52px;
      border-radius: 5px;
      object-fit: cover;
      background: var(--bg);
      border: 1px solid var(--border);
    }
    .card-mid {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .card-top {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px 6px;
      min-width: 0;
    }
    .ts-badge {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
    }
    .frame-badge {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
    }
    .zone-badge {
      font-size: 11px;
      color: var(--muted);
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0 6px;
      border-radius: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .human-badge {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.09);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 0 5px;
      border-radius: 4px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .garment-line {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .swatch {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      flex-shrink: 0;
    }
    .conf-badge {
      font-family: var(--mono);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      padding: 3px 8px;
      border-radius: 5px;
      background: var(--bg);
      border: 1px solid var(--border);
    }

    .empty-state {
      margin: auto;
      padding: 32px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
    .fallback-banner {
      padding: 9px 11px;
      background: rgba(245, 158, 11, 0.10);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 7px;
      color: #FCD34D;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 4px;
    }
    .reason-badge {
      font-size: 10px;
      color: #FCD34D;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.30);
      padding: 0 5px;
      border-radius: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    @media (max-width: 960px) {
      body { height: auto; overflow: auto; }
      .workspace { grid-template-columns: 1fr; }
      .stage { border-right: none; border-bottom: 1px solid var(--border); }
      .player-wrap { min-height: 280px; }
      .results-pane { min-height: 420px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark"><div class="brand-dot"></div></div>
      <span>SIGHTLINE</span>
    </div>
    <div class="topbar-controls">
      <span class="status-pill" id="indexStatus">--</span>
      <a class="status-pill" id="scanFileLink" href="#" download style="display:none;text-decoration:none;color:var(--accent)" title="Download scan results with timestamps"></a>
      <input id="fileInput" type="file" accept="video/*,.mp4,.mov,.avi,.mkv,.webm" style="display:none" />
      <button class="btn-primary" id="uploadBtn">Upload Video</button>
      <button class="btn-primary" id="scanBtn">Scan Video</button>
    </div>
  </header>

  <section class="search-strip">
    <div class="search-row">
      <div class="search-box">
        <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input id="searchInput" class="search-input" type="text" placeholder="Search clothing (e.g. Blue jacket, White hoodie, Pink shirt, Black pants)" autocomplete="off" />
        <span class="kbd-hint">/</span>
      </div>
      <select id="colorSelect" class="filter-select" aria-label="Filter color">
        <option value="">All Colors</option>
      </select>
      <select id="typeSelect" class="filter-select" aria-label="Filter garment type">
        <option value="">All Types</option>
      </select>
      <button id="clearBtn" class="btn-ghost">Reset</button>
    </div>
  </section>

  <main class="workspace">
    <section class="stage">
      <div class="player-wrap">
        <div class="video-stage-inner">
          <video id="videoPlayer" preload="metadata" controls playsinline></video>
          <canvas id="overlay"></canvas>
        </div>
      </div>

      <div class="timeline-panel">
        <div class="timeline-track" id="timelineTrack" title="Click timestamp marker">
          <div class="timeline-progress" id="timelineProgress"></div>
          <div class="timeline-playhead" id="timelinePlayhead"></div>
          <div id="timelineTicks"></div>
        </div>
        <div class="transport">
          <div class="transport-left">
            <button class="t-btn" id="prevBtn">[ Prev</button>
            <button class="t-btn" id="nextBtn">Next ]</button>
            <span class="time-readout" id="timeReadout">00:00.0 / 00:00.0</span>
          </div>
          <div class="transport-right">
            <span class="active-tag" id="activeMatchTag">Select a match</span>
          </div>
        </div>
      </div>
    </section>

    <aside class="results-pane">
      <div class="results-head">
        <div>
          <span class="results-title" id="matchTitle">Matches (0)</span>
          <span class="query-speed" id="querySpeed"></span>
        </div>
        <div class="seg-group" id="sortGroup">
          <button class="seg-btn active" data-sort="time">Time</button>
          <button class="seg-btn" data-sort="confidence">Conf</button>
        </div>
      </div>
      <div class="results-list" id="resultsList"></div>
    </aside>
  </main>

  <script>
    const state = {
      quality: 'latest',
      sort: 'time',
      matches: [],
      tracks: [],
      tracksByKey: new Map(),
      isFallback: false,
      userSelected: false,
      selectedIdx: -1,
      durationSec: 110.9,
      debounceTimer: null,
      rafId: null
    };

    const videoEl = document.getElementById('videoPlayer');
    const overlayEl = document.getElementById('overlay');
    const searchEl = document.getElementById('searchInput');
    const colorEl = document.getElementById('colorSelect');
    const typeEl = document.getElementById('typeSelect');
    const listEl = document.getElementById('resultsList');
    const ticksEl = document.getElementById('timelineTicks');
    const playheadEl = document.getElementById('timelinePlayhead');
    const progressEl = document.getElementById('timelineProgress');
    const timeReadoutEl = document.getElementById('timeReadout');
    const activeTagEl = document.getElementById('activeMatchTag');
    const matchTitleEl = document.getElementById('matchTitle');
    const querySpeedEl = document.getElementById('querySpeed');
    const statusEl = document.getElementById('indexStatus');
    const scanFileLink = document.getElementById('scanFileLink');
    const uploadBtn = document.getElementById('uploadBtn');
    const fileInput = document.getElementById('fileInput');
    const scanBtn = document.getElementById('scanBtn');

    function fmtTime(sec) {
      if (!isFinite(sec) || sec < 0) sec = 0;
      const m = Math.floor(sec / 60);
      const s = (sec - m * 60).toFixed(1).padStart(4, '0');
      return `${String(m).padStart(2, '0')}:${s}`;
    }

    async function loadTracks(q) {
      try {
        const res = await fetch(`/api/tracks/${encodeURIComponent(q)}`);
        if (!res.ok) {
          state.tracks = [];
          state.tracksByKey = new Map();
          return;
        }
        const data = await res.json();
        state.tracks = data.detections || [];
        const byKey = new Map();
        for (const d of state.tracks) {
          const tid = d.track_id || 0;
          const key = tid > 0 ? `t_${tid}` : `s_${d.shopper_num}`;
          if (!byKey.has(key)) byKey.set(key, []);
          byKey.get(key).push(d);
        }
        state.tracksByKey = byKey;
      } catch {
        state.tracks = [];
        state.tracksByKey = new Map();
      }
    }

    async function loadStats() {
      const res = await fetch(`/api/stats?quality=${encodeURIComponent(state.quality)}`);
      const data = await res.json();
      if (data.quality) state.quality = data.quality;
      const v = data.video;
      if (v) {
        statusEl.textContent = `${state.quality} (${v.width}x${v.height}) · ${data.total_detections} indexed`;
        state.durationSec = v.duration_sec;
        const targetSrc = `/video/${encodeURIComponent(state.quality)}`;
        if (videoEl.getAttribute('src') !== targetSrc) {
          videoEl.src = targetSrc;
        }
        if (data.scan_json_file) {
          scanFileLink.style.display = 'inline-block';
          scanFileLink.href = `/api/scan-file/${encodeURIComponent(state.quality)}`;
          scanFileLink.download = data.scan_json_file;
          scanFileLink.textContent = data.scan_json_file;
        }
        await loadTracks(state.quality);
        updateTimeUI();
      } else {
        statusEl.textContent = `${state.quality} · unindexed`;
        scanFileLink.style.display = 'none';
        state.tracks = [];
        state.tracksByKey = new Map();
      }

      const prevC = colorEl.value;
      colorEl.innerHTML = '<option value="">All Colors</option>';
      (data.colors || []).forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.color;
        opt.textContent = `${c.short_color} (${c.count})`;
        colorEl.appendChild(opt);
      });
      colorEl.value = prevC;

      const prevT = typeEl.value;
      typeEl.innerHTML = '<option value="">All Types</option>';
      (data.types || []).forEach(t => {
        const opt = document.createElement('option');
        opt.value = t.type;
        opt.textContent = `${t.short_type} (${t.count})`;
        typeEl.appendChild(opt);
      });
      typeEl.value = prevT;
    }

    async function runSearch(preserveTime = false) {
      if (!preserveTime) state.userSelected = false;
      const params = new URLSearchParams({
        q: searchEl.value.trim(),
        quality: state.quality,
        color: colorEl.value,
        type: typeEl.value,
        sort: state.sort
      });
      const res = await fetch(`/api/search?${params.toString()}`);
      const data = await res.json();
      const closeMatches = data.close_matches || [];
      if ((data.matches || []).length === 0 && closeMatches.length > 0) {
        state.isFallback = true;
        state.matches = closeMatches;
        matchTitleEl.textContent = `Matches (0) · ${closeMatches.length} close`;
      } else {
        state.isFallback = false;
        state.matches = data.matches || [];
        matchTitleEl.textContent = `Matches (${data.match_count})`;
      }
      state.durationSec = data.duration_sec || state.durationSec;
      querySpeedEl.textContent = `${data.unique_timestamp_events} moments · ${data.query_ms} ms`;

      renderMatches();
      renderTimelineTicks();
      if (!preserveTime && state.matches.length > 0) {
        selectMatch(0, false, false);
      } else if (state.matches.length === 0) {
        state.selectedIdx = -1;
        state.userSelected = false;
        activeTagEl.textContent = 'No match selected';
        drawOverlay();
      } else {
        drawOverlay();
      }
    }

    function zoneLabel(z) {
      if (z === 'lower') return 'Lower';
      if (z === 'outer_upper') return 'Outer';
      if (z === 'inner_upper') return 'Inner';
      return 'Upper';
    }

    function renderMatches() {
      listEl.innerHTML = '';
      if (!state.matches.length) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = 'No matching clothing found.';
        listEl.appendChild(empty);
        return;
      }
      if (state.isFallback) {
        const banner = document.createElement('div');
        banner.className = 'fallback-banner';
        banner.textContent = 'No exact match found — you might be thinking of this:';
        listEl.appendChild(banner);
      }
      const frag = document.createDocumentFragment();
      state.matches.forEach((m, idx) => {
        const card = document.createElement('button');
        card.className = 'match-card' + (idx === state.selectedIdx ? ' selected' : '');
        card.dataset.idx = idx;
        const humanHtml = `<span class="human-badge">Human ${Math.round(m.human_conf ?? 95)}%</span>`;
        const reasonHtml = (state.isFallback && m.similarity_reason) ? `<span class="reason-badge">${m.similarity_reason}</span>` : '';
        card.innerHTML = `
          <img class="thumb" src="data:image/jpeg;base64,${m.thumb_b64}" alt="" loading="lazy" />
          <div class="card-mid">
            <div class="card-top">
              <span class="ts-badge">${m.timestamp_str}</span>
              <span class="frame-badge">F${m.frame_idx}</span>
              <span class="zone-badge">${zoneLabel(m.zone)}</span>
              ${humanHtml}
              ${reasonHtml}
            </div>
            <div class="garment-line">
              <span class="swatch" style="background:${m.color_hex}"></span>
              <span>${m.short_color} · ${m.short_type}</span>
            </div>
          </div>
          <span class="conf-badge">${Math.round(m.joint_conf)}%</span>
        `;
        card.onclick = () => selectMatch(idx, true);
        frag.appendChild(card);
      });
      listEl.appendChild(frag);
    }

    function renderTimelineTicks() {
      ticksEl.innerHTML = '';
      const frag = document.createDocumentFragment();
      state.matches.forEach((m, idx) => {
        const t = document.createElement('div');
        t.className = 'tick' + (idx === state.selectedIdx ? ' selected' : '');
        t.style.left = `${m.timeline_pct}%`;
        t.style.background = m.color_hex === '#1E293B' ? '#94A3B8' : m.color_hex;
        t.title = `${m.timestamp_str} · ${m.short_color} ${m.short_type}`;
        t.onclick = (e) => {
          e.stopPropagation();
          selectMatch(idx, true);
        };
        frag.appendChild(t);
      });
      ticksEl.appendChild(frag);
    }

    function selectMatch(idx, seekVideo = true, isUserAction = seekVideo) {
      if (idx < 0 || idx >= state.matches.length) return;
      state.selectedIdx = idx;
      if (isUserAction) state.userSelected = true;
      const m = state.matches[idx];

      document.querySelectorAll('.match-card.selected').forEach(el => el.classList.remove('selected'));
      const targetCard = listEl.querySelector(`.match-card[data-idx="${idx}"]`);
      if (targetCard) {
        targetCard.classList.add('selected');
        targetCard.scrollIntoView({ block: 'nearest' });
      }
      renderTimelineTicks();

      activeTagEl.innerHTML = `<span class="swatch" style="background:${m.color_hex}"></span>${m.timestamp_str} · Human ${Math.round(m.human_conf ?? 95)}% · ${m.short_color} ${m.short_type} (${Math.round(m.joint_conf)}%)`;

      if (seekVideo) {
        videoEl.pause();
        videoEl.currentTime = m.timestamp_sec;
      }
      drawOverlay();
    }

    function getVideoRenderRect() {
      const cw = overlayEl.width;
      const ch = overlayEl.height;
      const vw = videoEl.videoWidth || 1270;
      const vh = videoEl.videoHeight || 720;
      const scale = Math.min(cw / vw, ch / vh);
      const rw = vw * scale;
      const rh = vh * scale;
      return { x: (cw - rw) / 2, y: (ch - rh) / 2, w: rw, h: rh };
    }

    function lerpBox(b0, b1, alpha) {
      return [
        b0[0] + (b1[0] - b0[0]) * alpha,
        b0[1] + (b1[1] - b0[1]) * alpha,
        b0[2] + (b1[2] - b0[2]) * alpha,
        b0[3] + (b1[3] - b0[3]) * alpha
      ];
    }

    function interpolateTrackZone(pts, curTime) {
      if (!pts || !pts.length) return null;
      let prev = null;
      let next = null;
      let best = null;
      let bestDist = Infinity;
      for (const p of pts) {
        const dt = p.timestamp_sec - curTime;
        const absDt = Math.abs(dt);
        if (absDt < bestDist) {
          bestDist = absDt;
          best = p;
        }
        if (dt <= 0 && (!prev || p.timestamp_sec > prev.timestamp_sec)) prev = p;
        if (dt >= 0 && (!next || p.timestamp_sec < next.timestamp_sec)) next = p;
      }
      if (prev && next && prev !== next && (next.timestamp_sec - prev.timestamp_sec) <= 1.25) {
        const span = Math.max(1e-4, next.timestamp_sec - prev.timestamp_sec);
        const alpha = (curTime - prev.timestamp_sec) / span;
        const base = alpha < 0.5 ? prev : next;
        return {
          ...base,
          person_box_norm: lerpBox(prev.person_box_norm, next.person_box_norm, alpha),
          sub_box_norm: lerpBox(prev.sub_box_norm, next.sub_box_norm, alpha)
        };
      }
      if (best && bestDist <= 0.45) return best;
      return null;
    }

    function getActiveTracksAtTime(curTime) {
      const result = [];
      const zonePriority = { upper: 0, outer_upper: 1, inner_upper: 2, lower: 3 };
      for (const rows of state.tracksByKey.values()) {
        const byZone = new Map();
        for (const r of rows) {
          if (!byZone.has(r.zone)) byZone.set(r.zone, []);
          byZone.get(r.zone).push(r);
        }
        const zonesSorted = [...byZone.keys()].sort((a, b) => (zonePriority[a] ?? 9) - (zonePriority[b] ?? 9));
        for (const z of zonesSorted) {
          const item = interpolateTrackZone(byZone.get(z), curTime);
          if (item) {
            result.push(item);
            break;
          }
        }
      }
      return result;
    }

    function getSmoothBoxForMatch(m, curTime) {
      if (!m || !m.track_id || !state.tracksByKey.has(`t_${m.track_id}`)) return m;
      const zRows = state.tracksByKey.get(`t_${m.track_id}`).filter(r => r.zone === m.zone);
      const interp = interpolateTrackZone(zRows, curTime);
      if (!interp) return m;
      return {
        ...m,
        person_box_norm: interp.person_box_norm,
        sub_box_norm: interp.sub_box_norm
      };
    }

    function drawBoxWithPill(ctx, vr, det, styleMode) {
      const [px1, py1, px2, py2] = det.person_box_norm;
      const [sx1, sy1, sx2, sy2] = det.sub_box_norm;
      const px = vr.x + px1 * vr.w;
      const py = vr.y + py1 * vr.h;
      const pw = (px2 - px1) * vr.w;
      const ph = (py2 - py1) * vr.h;
      const isCyan = styleMode === 'cyan';

      ctx.save();
      ctx.strokeStyle = isCyan ? 'rgba(241, 245, 249, 0.72)' : 'rgba(148, 163, 184, 0.58)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([5, 4]);
      ctx.strokeRect(px, py, pw, ph);
      ctx.restore();

      if (isCyan) {
        const bx = vr.x + sx1 * vr.w;
        const by = vr.y + sy1 * vr.h;
        const bw = (sx2 - sx1) * vr.w;
        const bh = (sy2 - sy1) * vr.h;
        ctx.strokeStyle = '#38BDF8';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(bx, by, bw, bh);
      }

      const confPart = isCyan ? ` (${Math.round(det.joint_conf)}%)` : '';
      const label = `Human ${Math.round(det.human_conf ?? 95)}% · ${det.short_color} · ${det.short_type}${confPart}`;
      ctx.font = isCyan ? '600 12px "Geist", system-ui, sans-serif' : '500 11.5px "Geist", system-ui, sans-serif';
      const tw = ctx.measureText(label).width + 14;
      const lx = Math.max(4, Math.min(overlayEl.width - tw - 4, px));
      const ly = Math.max(24, py - 6);
      ctx.fillStyle = isCyan ? 'rgba(11, 13, 17, 0.92)' : 'rgba(15, 23, 42, 0.78)';
      ctx.fillRect(lx, ly - 18, tw, 20);
      ctx.strokeStyle = isCyan ? '#38BDF8' : 'rgba(148, 163, 184, 0.55)';
      ctx.lineWidth = 1;
      ctx.strokeRect(lx, ly - 18, tw, 20);
      ctx.fillStyle = isCyan ? '#F1F5F9' : 'rgba(226, 232, 240, 0.88)';
      ctx.fillText(label, lx + 7, ly - 4);
    }

    function drawOverlay() {
      const rect = overlayEl.getBoundingClientRect();
      if (overlayEl.width !== Math.round(rect.width) || overlayEl.height !== Math.round(rect.height)) {
        overlayEl.width = Math.max(1, Math.round(rect.width));
        overlayEl.height = Math.max(1, Math.round(rect.height));
      }
      const ctx = overlayEl.getContext('2d');
      ctx.clearRect(0, 0, overlayEl.width, overlayEl.height);

      const curTime = videoEl.currentTime || 0;
      const vr = getVideoRenderRect();
      const activeHumans = getActiveTracksAtTime(curTime);
      const hasFilter = Boolean(searchEl.value.trim() || colorEl.value || typeEl.value);
      const selectedMatch = (state.selectedIdx >= 0 && state.selectedIdx < state.matches.length) ? state.matches[state.selectedIdx] : null;

      const cyanByTarget = new Map();
      const highlightedTrackIds = new Set();

      if (hasFilter && !state.isFallback) {
        const bestDistByTarget = new Map();
        for (const m of state.matches) {
          const absDt = Math.abs(m.timestamp_sec - curTime);
          if (absDt > 0.45) continue;
          const key = m.track_id > 0 ? `t_${m.track_id}_${m.zone}` : `s_${m.shopper_num}_${m.zone}`;
          if (!bestDistByTarget.has(key) || absDt < bestDistByTarget.get(key)) {
            bestDistByTarget.set(key, absDt);
            cyanByTarget.set(key, getSmoothBoxForMatch(m, curTime));
            if (m.track_id > 0) highlightedTrackIds.add(m.track_id);
          }
        }
      }

      if (state.userSelected && selectedMatch && Math.abs(curTime - selectedMatch.timestamp_sec) <= 2.5) {
        const key = selectedMatch.track_id > 0 ? `t_${selectedMatch.track_id}_${selectedMatch.zone}` : `sel_${selectedMatch.id}`;
        if (!cyanByTarget.has(key)) {
          cyanByTarget.set(key, getSmoothBoxForMatch(selectedMatch, curTime));
        }
        if (selectedMatch.track_id > 0) highlightedTrackIds.add(selectedMatch.track_id);
      }

      // Pass 1: Render all humans present at currentTime in dimmed slate
      for (const h of activeHumans) {
        if (h.track_id > 0 && highlightedTrackIds.has(h.track_id)) continue;
        drawBoxWithPill(ctx, vr, h, 'slate');
      }

      // Pass 2: Render active search targets / explicitly selected match in bright cyan on top
      for (const cm of cyanByTarget.values()) {
        drawBoxWithPill(ctx, vr, cm, 'cyan');
      }
    }

    function updateTimeUI() {
      const dur = (isFinite(videoEl.duration) && videoEl.duration > 0) ? videoEl.duration : (state.durationSec || 110.9);
      const cur = videoEl.currentTime || 0;
      const pct = Math.min(100, (cur / dur) * 100);
      playheadEl.style.left = `${pct}%`;
      progressEl.style.width = `${pct}%`;
      timeReadoutEl.textContent = `${fmtTime(cur)} / ${fmtTime(dur)}`;
      drawOverlay();
    }

    function setVideoQuality(q) {
      state.quality = q;
      const prevTime = videoEl.currentTime || 0;
      videoEl.src = `/video/${encodeURIComponent(q)}`;
      videoEl.addEventListener('loadedmetadata', () => {
        if (prevTime > 0 && prevTime < videoEl.duration) videoEl.currentTime = prevTime;
        updateTimeUI();
      }, { once: true });
      loadStats().then(() => runSearch(true));
    }

    // Event bindings
    searchEl.addEventListener('input', () => {
      clearTimeout(state.debounceTimer);
      state.debounceTimer = setTimeout(() => runSearch(), 110);
    });
    colorEl.addEventListener('change', () => runSearch());
    typeEl.addEventListener('change', () => runSearch());
    document.getElementById('clearBtn').addEventListener('click', () => {
      searchEl.value = '';
      colorEl.value = '';
      typeEl.value = '';
      state.userSelected = false;
      runSearch();
    });

    async function uploadAndScanFile(file) {
      if (!file) return;
      uploadBtn.disabled = true;
      scanBtn.disabled = true;
      uploadBtn.textContent = 'Scanning...';
      statusEl.textContent = `Scanning ${file.name}...`;
      try {
        const res = await fetch(`/api/upload?filename=${encodeURIComponent(file.name)}&stride=0`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/octet-stream' },
          body: file
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Upload failed');
        searchEl.value = '';
        colorEl.value = '';
        typeEl.value = '';
        state.userSelected = false;
        setVideoQuality(data.quality);
      } catch (err) {
        statusEl.textContent = `Upload error: ${err.message}`;
      } finally {
        uploadBtn.disabled = false;
        scanBtn.disabled = false;
        uploadBtn.textContent = 'Upload Video';
        fileInput.value = '';
      }
    }

    uploadBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) uploadAndScanFile(e.target.files[0]);
    });
    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) {
        uploadAndScanFile(e.dataTransfer.files[0]);
      }
    });

    document.querySelectorAll('#sortGroup .seg-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.sort = btn.dataset.sort;
        document.querySelectorAll('#sortGroup .seg-btn').forEach(b => b.classList.toggle('active', b.dataset.sort === state.sort));
        runSearch(true);
      });
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
      if (state.matches.length) selectMatch(Math.max(0, state.selectedIdx - 1), true);
    });
    document.getElementById('nextBtn').addEventListener('click', () => {
      if (state.matches.length) selectMatch(Math.min(state.matches.length - 1, state.selectedIdx + 1), true);
    });

    document.getElementById('timelineTrack').addEventListener('click', (e) => {
      const rect = e.currentTarget.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      videoEl.currentTime = pct * (videoEl.duration || state.durationSec);
      drawOverlay();
    });

    scanBtn.addEventListener('click', async () => {
      scanBtn.disabled = true;
      scanBtn.textContent = 'Scanning...';
      try {
        await fetch(`/api/scan?quality=${encodeURIComponent(state.quality)}&stride=0`, { method: 'POST' });
        await loadStats();
        await runSearch(true);
      } finally {
        scanBtn.disabled = false;
        scanBtn.textContent = 'Scan Video';
      }
    });

    function tickPlayback() {
      updateTimeUI();
      if (!videoEl.paused && !videoEl.ended) {
        state.rafId = requestAnimationFrame(tickPlayback);
      } else {
        state.rafId = null;
      }
    }

    videoEl.addEventListener('play', () => {
      if (!state.rafId) state.rafId = requestAnimationFrame(tickPlayback);
    });
    videoEl.addEventListener('pause', () => {
      if (state.rafId) {
        cancelAnimationFrame(state.rafId);
        state.rafId = null;
      }
      drawOverlay();
    });
    videoEl.addEventListener('ended', () => {
      if (state.rafId) {
        cancelAnimationFrame(state.rafId);
        state.rafId = null;
      }
      drawOverlay();
    });
    videoEl.addEventListener('timeupdate', updateTimeUI);
    videoEl.addEventListener('seeked', drawOverlay);
    window.addEventListener('resize', drawOverlay);

    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement !== searchEl) {
        e.preventDefault();
        searchEl.focus();
      } else if (e.key === '[' && document.activeElement !== searchEl && state.matches.length) {
        selectMatch(Math.max(0, state.selectedIdx - 1), true);
      } else if (e.key === ']' && document.activeElement !== searchEl && state.matches.length) {
        selectMatch(Math.min(state.matches.length - 1, state.selectedIdx + 1), true);
      }
    });

    loadStats().then(() => runSearch());
  </script>
</body>
</html>
